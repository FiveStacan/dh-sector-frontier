# Notes:
# I want to lie, shipwrecked and comatose, drinking fresh mango juice.
- type: pointOfInterest
  id: Bahama
  parent: BasePOI
  name: "Ресторан Багамы"
  minimumDistance: 1200
  maximumDistance: 2900
  spawnGamePreset: [ NFAdventure, NFPirate, LuaAdventure ]
  spawnGroup: RestStop
  gridPath: /Maps/_NF/POI/bahama.yml
  addComponents:
  - type: RadarBlipIcon
    icon: /Textures/_Lua/Interface/Radar/space-outpost.png
    scale: 1.2
    allowWhenHidden: true
  - type: StationTransit #DH
    routes:
      MinorPointsOfInterest: 10
  - type: SolarPoweredGrid
    trackOnInit: true
    doNotCull: true

- type: gameMap
  id: Bahama
  mapName: "Ресторан Багамы"
  mapPath: /Maps/_NF/POI/bahama.yml
  minPlayers: 0
  stations:
    Bahama:
      stationProto: DeadDropFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: "Bahama Mama's"
