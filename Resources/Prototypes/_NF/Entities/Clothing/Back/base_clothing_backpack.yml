- type: entity
  parent: [BaseSubfloorAnchorStorage, ClothingBackpack]
  id: NFClothingBackpack
  components:
  - type: Storage
    maxItemSize: Large
    defaultStorageOrientation: Vertical
    grid:
    - 0,0,6,3
    - 8,0,8,2 #DH
  - type: Item
    size: Huge
    shape:
    - 0,0,6,3

- type: entity
  parent: [BaseSubfloorAnchorStorage, ClothingBackpackDuffel]
  id: NFClothingDuffel
  components:
  - type: Storage
    maxItemSize: Huge
    defaultStorageOrientation: Vertical
    grid:
    - 0,0,7,4
  - type: Item
    size: Huge
    shape:
    - 0,0,7,5

- type: entity
  abstract: true
  parent: NFClothingBackpack
  id: NFClothingMessenger
  components:
  - type: Clothing #DH
    equipDelay: 1.4
    unequipDelay: 0.9
    quickEquip: false
    slots:
    - back
    # - suitstorage #DH need sprites
  ## One 4x4 pocket, four 2x2 pockets
  - type: Storage
    grid:
    - 0,0,1,1
    - 0,3,1,4
    - 3,0,6,3
    - 8,0,8,1 #DH 2x2 > 1x2
    - 8,3,8,4 #DH 2x2 > 1x2

  # Alternative layouts
