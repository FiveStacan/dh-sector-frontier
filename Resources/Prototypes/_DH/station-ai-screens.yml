- type: entity
  parent: ClothingHeadBase
  id: BaseAiHat
  name: Ai Hat
  description: Looks strange but cool
  components:
  - type: Sprite
    sprite: ADT/Clothing/Head/Hats/johan_cap.rsi
  - type: Clothing
    sprite: /Textures/_DH/Mobs/Silicon/ai-screen.rsi
    state: ai
    shader: unshaded
  - type: Tag
    tags:
    - AIWearable

- type: inventoryTemplate
  id: AiHat
  slots:
  - name: head
    slotTexture: head
    slotFlags: HEAD
    uiWindowPos: 0,1
    strippingWindowPos: 0,0
    displayName: Head
    offset: 0, 0
    whitelist:
      tags:
        - AIWearable

