- type: entity
  parent: GrenadeBase
  id: GrenadeBarrier
  name: barrier grenade
  description: Instant cover.
  components:
  - type: Sprite
    sprite: _DH/Objects/Weapons/Grenades/barrier.rsi
  - type: SoundOnTrigger
    sound:
      path: "/Audio/Effects/snap.ogg"
  - type: DeleteOnTrigger
  - type: SpawnOnTrigger
    proto: DeployableBarrierLocked
  - type: SmokeOnTrigger
    duration: 1
    spreadAmount: 1
  - type: Appearance
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Effects/countdown.ogg

- type: entity
  parent: DeployableBarrier
  id: DeployableBarrierLocked
  suffix: Locked
  components:
  - type: Lock
    locked: true
  - type: TimedDespawn
    lifetime: 122
  - type: SpawnOnDespawn
    prototype: EffectFlashBluespace
#  - type: Transform # Skill Issue
#    anchored: true
#  - type: Physics
#    bodyType: Dynamic

- type: entity
  parent: [ScatteringGrenadeBase, BaseSyndicateContraband]
  id: ClusterSyndyFlashGrenade
  name: Godkiss
  description: The probability that you will be banned for using this grenade is 99.9%.
  components:
  - type: Sprite
    sprite: _DH/Objects/Weapons/Grenades/clustersyndygrenade.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: ScatteringGrenade
    capacity: 20
    fillPrototype: ExGrenade #SyndyFlashGrenade
    distance: 4
  - type: OnUseTimerTrigger
    initialBeepDelay: 0
    beepInterval: 0.5
    delay: 3.5
    beepSound:
      path: "/Audio/Effects/minibombcountdown.ogg"
      params:
        volume: 12
  - type: EmitSoundOnTrigger
    sound:
      path: "/Audio/Machines/door_lock_off.ogg"
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Effects/countdown.ogg
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed: { state: primed }
          Unprimed: { state: icon }

- type: entity
  parent: [ClusterGrenade, ClusterSyndyFlashGrenade]
  id: SyndyClusterGrenade
  name: syndyclustergrenade
  description: If you don't care about accuracy, then this choice is for you.
  components:
  - type: Sprite
    sprite: _DH/Objects/Weapons/Grenades/clustersyndygrenade.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: ScatteringGrenade
    fillPrototype: SyndieMiniBomb
    distance: 4
    capacity: 3
  - type: OnUseTimerTrigger
    beepSound:
      path: "/Audio/Effects/minibombcountdown.ogg"
      params:
        volume: 12
  - type: EmitSoundOnTrigger
    sound:
      path: "/Audio/Machines/door_lock_off.ogg"
