- type: entity
  id: BaseWeaponAutoPowerCell
  parent: BaseWeaponPowerCell
  abstract: true
  components:
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/laser_retro.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    fireRate: 4
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_DH/Weapons/Guns/Lasers/EG_R.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: PowerCellHigh
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - PowerCell
            - PowerCellHigh

- type: entity
  name:  IK-30 laser carbine
  parent: [ BaseWeaponPowerCell, BaseRestrictedContraband ] #BaseWeaponAutoPowerCell
  id: WeaponGunLaserCarbineSemi
  description: A semi-automatic battery laser carbine.
  components:
  - type: Sprite
    sprite: _DH/Objects/Weapons/Guns/Battery/batterylaser_carbine.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 2.75
    availableModes:
      - SemiAuto
      - FullAuto
  - type: Clothing
    sprite: _DH/Objects/Weapons/Guns/Battery/batterylaser_carbine.rsi
    quickEquip: false
    slots:
    - suitStorage
  - type: Item
    size: Huge
    shape:
    - 0,0,4,1
    sprite: _DH/Objects/Weapons/Guns/Battery/batterylaser_carbine.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true

