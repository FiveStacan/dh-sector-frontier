- type: entity
  name: bananahilator
  parent: BaseItem
  id: ADTBananahilator
  description: Alternative evolution branch of gatfruits. This thing looks funny and usefull at same time.
  components:
  - type: Sprite
    sprite: _DH/Objects/Weapons/Guns/Pistols/bananigilator.rsi
    state: icon
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Tag
    tags:
    - Sidearm
  - type: Clothing
    sprite: _DH/Objects/Weapons/Guns/Pistols/bananigilator.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Gun
    maxAngle: 8.5
    minAngle: 6
    angleDecay: 3
    angleIncrease: 2.5
    projectileSpeed: 15
    fireRate: 5.7
    burstFireRate: 6.2
    burstCooldown: 0.45
    shotsPerBurst: 2
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
      - Burst
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
  - type: AmmoCounter
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 3.4
    rechargeSound:
      path: /Audio/Weapons/Guns/Cock/pistol_cock.ogg
  - type: BasicEntityAmmoProvider
    proto: ADTBulletHoly
    capacity: 4
    count: 1
  #- type: HolyDamage

- type: entity
  name: radiation emitter
  parent: BaseWeaponBatterySmall
  id: RadiationEmitter
  description: A gun designed on the basis of the well-known C.H.I.M.P. When fired, it emits a slow stream of radioactive particles.
  components:
  - type: Sprite
    sprite: _DH/Objects/Weapons/Guns/Revolvers/radiation_emitter.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-1
      visible: false
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/chimp.rsi
  - type: Gun
    projectileSpeed: 2
    fireRate: 0.5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser2.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: RadiationBullet
    fireCost: 100
  - type: Construction
    graph: UpgradeWeaponPistolCHIMP
    node: start
  - type: StaticPrice
    price: 100
