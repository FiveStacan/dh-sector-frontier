    channels:
    - SpacePrisoners
    defaultChannel: SpacePrisoners
  - type: Item
    sprite: _DH/Objects/Devices/encryption_keys.rsi
    size: Tiny
  - type: Sprite
    sprite: _DH/Objects/Devices/encryption_keys.rsi
    layers:
    - state: crypt_gray
    - state: prisoners_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyPrisonCommand
  name: Prison control encryption key
  description: An encryption key for Prison.
  components:
  - type: EncryptionKey
    channels:
    - SpacePrison
    - Nfsd
    - Security
    defaultChannel: SpacePrison
  - type: Item
    sprite: _DH/Objects/Devices/encryption_keys.rsi
    size: Tiny
  - type: Sprite
    sprite: _DH/Objects/Devices/encryption_keys.rsi
    layers:
