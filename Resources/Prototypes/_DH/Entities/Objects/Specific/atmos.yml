- type: entity
  name: termometer
  parent: BaseItem
  id: termometer
  description: A hand-held termometer.
  components:
  - type: Sprite
    sprite: _DH/Objects/Tools/termometer.rsi
    layers:
      - state: icon
        map: ["analyzer"]
  - type: GasAnalyzer
  - type: ActivatableUI
    inHandsOnly: true
    singleUser: true
    requireActiveHand: false
    key: enum.GasAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.GasAnalyzerUiKey.Key:
        type: GasAnalyzerBoundUserInterface
  - type: Appearance
  - type: GenericVisualizer
    visuals:
        enum.GasAnalyzerVisuals.Enabled:
          enabled:
            True: { state: working }
            False: { state: icon }
  - type: StaticPrice
    price: 12
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Glass: 100
