- type: entity
  parent: IDCardStandard
  id: PermaPrisonerIDCard
  name: perma prisoner ID card
  description: A generically printed ID card for scummy prisoners.
  components:
  - type: Sprite
    layers:
    - sprite: _DH/Objects/Misc/id_cards.rsi
      state: prisoner-space-prison
    - sprite: _DH/Objects/Misc/id_cards.rsi
      state: idprisoner-space-prison
  - type: Item
    heldPrefix: default
  - type: Access
    tags:
    - GenpopEnter
  - type: GenpopIdCard
  - type: IdCard
    jobTitle: job-name-perma-prisoner
    jobIcon: JobIconPermaPrisoner
    canMicrowave: false
  - type: Speech
    speechVerb: Robotic
  - type: StaticPrice
    price: 3
  - type: PresetIdCard
    job: PermaPrisoner

