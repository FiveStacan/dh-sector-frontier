- type: entity
  id: MobFog
  parent: SimpleSpaceMobBase
  name: Фог
  suffix: Мурино
  components:
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_DH/Mobs/Fog/babachai.ogg
      params:
        variation: 0.90
        volume: -1
        loop: false
  #- type: LumenAversion
  - type: AutoBoo
    spawnAnomalyOnInit: PlushieSpamton
  - type: Prying
    force: true
    pryPowered: true
    speedModifier: 7
  - type: PryUnpowered
  - type: Insulated
  - type: AutoImplant
    implants:
    - DeathAcidifierImplant
  - type: IgnoreKudzu
  - type: ZombieImmune
  - type: Sprite
    drawdepth: Mobs
    layers:
      - state: spookysmoke
        sprite: _Lua/admem/horror.rsi
      - map: ["enum.DamageStateVisualLayers.Base"]
        sprite: _DH/Mobs/Mell/fog.rsi
        state: icon
        shader: unshaded
  - type: HTN
    rootTask:
      task: XenoCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      4000: Critical
      5000: Dead
  - type: Reflect
    reflectProb: 0.10
    spread: 30
  - type: Puller
    needsHands: false
  - type: Bloodstream
    bloodReagent: GreyMatter
    bloodMaxVolume: 200
    bloodlossThreshold: 0.4
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: NightVision
    color: "#808080"
    activateSound: null
    deactivateSound: null
  - type: NPCMeleeCombat
    MissChance: 10
  - type: MeleeWeapon
    altDisarm: false
    hidden: true
    angle: 45
    soundHit:
     collection: Punch
    animation: WeaponArcSmash
    attackRate: 0.8
    damage:
      types:
        Blunt: 50
        Piercing: 10
        Structural: 40
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.3
    baseSprintSpeed: 1.85
  - type: HitscanBatteryAmmoProvider
    proto: ShadowPulse
    fireCost: 1
  - type: Gun
    useKey: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    fireRate: 0.4
    soundGunshot:
      path: /Audio/Weapons/click.ogg
      params:
        volume: -2
  - type: CombatMode
  - type: Battery
    maxCharge: 1750
    startingCharge: 1750
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 100
