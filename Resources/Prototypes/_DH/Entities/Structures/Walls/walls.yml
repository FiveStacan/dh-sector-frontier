- type: entity
  parent: [ WallWood, BaseWallDiagonal ]
  id: WallWoodTightDiagonal
  name: wood wall
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: _DH/Structures/Walls/wood_diagonal.rsi
    state: state0
  - type: IconSmooth
    mode: Diagonal
    key: walls
    base: state
  - type: Icon
    sprite: _DH/Structures/Walls/wood_diagonal.rsi
    state: state0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: Occluder
    enabled: false

- type: entity
  parent: BaseWall
  id: WallBathroom
  name: стена ванной
  suffix: Мытищи
  components:
  - type: Sprite
    sprite: _DH/Structures/Walls/bathroom.rsi
  - type: Icon
    sprite: _DH/Structures/Walls/bathroom.rsi
    state: full
  - type: Construction
    graph: Girder
    node: BathroomWall
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: ExplosionResistance
    damageCoefficient: 0.90
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 2000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: walls
    base: state
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ReinforcedWallVisuals.DeconstructionStage:
        ReinforcedWallVisualLayers.Deconstruction:
          -1: { visible: false }
          0: { state: bathroom_construct-0, visible: true}
          1: { state: bathroom_construct-1, visible: true}
          2: { state: bathroom_construct-2, visible: true}
          3: { state: bathroom_construct-3, visible: true}
          4: { state: bathroom_construct-4, visible: true}
          5: { state: bathroom_construct-5, visible: true}
  - type: ReinforcedWallReplacementMarker
  - type: StaticPrice
    price: 25
  - type: RadiationBlocker
    resistance: 1
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 2000
  - type: RCDDeconstructable
    cost: 4
    delay: 20
    fx: EffectRCDDeconstruct8

