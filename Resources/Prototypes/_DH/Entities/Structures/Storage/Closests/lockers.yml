- type: entity
  id: LockerPrisonerDH
  parent: ClosetSteelBase
  name: шкаф заключенного
  description: Это шкафчик для личных вещей заключенного, которые разрешено хранить во время пребывания в тюрьме.
  components:
  - type: Sprite
    sprite: _DH/Structures/Storage/closet.rsi
    noRot: true
    layers:
    - state: generic
      map: ["enum.StorageVisualLayers.Base"]
    - state: generic_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      offset: "-0.065,0"
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: EntityStorageVisuals
    stateBaseClosed: genpop
    stateDoorOpen: genpop_open
    stateDoorClosed: genpop_door

