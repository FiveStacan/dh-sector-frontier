- type: entity
  id: ResearchPointsDiskGenerator
  parent: [ NFBlueprintReceiverBase, SecurityTechFab ]
  name: фабрикатор исследовательских дисков
  description: Печатает исследовательские диски.
  components:
  #- type: StationAiWhitelist
  - type: SpriteFade
  - type: MaterialStorage
    whitelist:
      tags:
        - RawMaterial
        - Sheet
        - RawMaterial
        - Ingot
        - DHMaterials
  - type: Sprite
    sprite: _DH/Structures/Machines/points_generator.rsi
    offset: 0,1
    drawdepth: Mobs
    layers:
      - state: icon
        map: ["enum.LatheVisualLayers.IsRunning"]
      - state: unshaded
        shader: unshaded
        map: ["enum.PowerDeviceVisualLayers.Powered"]
      - state: inserting
        map: ["enum.MaterialStorageVisualLayers.Inserting"]
      - state: panel
        map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Transform
    anchored: true
  - type: ExtensionCableReceiver
  - type: ApcPowerReceiver
    powerLoad: 2000
  - type: AmbientSound
    range: 5
    volume: -6
    sound:
      path: /Audio/Ambience/Objects/anomaly_generator.ogg
  #- type: Machine
  #  board: Circuitboard
  - type: Physics
    bodyType: Static
  - type: Lathe
    idleState: icon
    runningState: generating
    unlitRunningState: generating_unshaded
    staticPacks:
    - ResearchDisks
    dynamicPacks:
    - ResearchDisksAdw
 # - type: BlueprintReceiver
 #   whitelist:
 #     tags:
 #     - NFBlueprintNfsdTechfab
 #     - NFBlueprintMercenaryTechfab
  - type: OreSiloClient
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-0.5,1.5,0.6"
        density: 50
        mask:
        - LargeMobMask
        layer:
        - WallLayer
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: Appearance
  - type: StaticPrice
    price: 10000
  - type: GuideHelp
    guides:
    - AnomalousResearch
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-mechanical
    weight: 0.2

