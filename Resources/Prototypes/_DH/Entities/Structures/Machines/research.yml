- type: entity
  id: NFSDResearchAndDevelopmentServer
  parent: ResearchAndDevelopmentServer
  name: NFSD R&D server
  suffix: NFSD
  components:
  - type: Sprite
    sprite: _DH/Structures/Machines/server.rsi
    snapCardinals: true
    layers:
      - state: server
      - state: variant-nfsd
      - state: server_o
        map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: TechnologyDatabase
    supportedDisciplines:
    #- NFGeneral
    - NFEngineering
    - NFMedical
    - NFSalvage
    - NFScience
    - NFService
    - Shiparmory
    - NFArsenal
    - NFArsenalMercenary
    - NFArsenalNfsd

