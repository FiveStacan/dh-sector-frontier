- type: entity
  parent: [MaterialReclaimer, BaseStructureWallmount]
  id: WallmountMaterialReclaimer
  name: Настенный переработчик материалов
  description: Не может переработать обратно нематериальное, например, мотивацию.
  components:
  - type: Sprite
    sprite: _DH/Structures/Machines/ID_reclaimer.rsi
    drawdepth: WallMountedItems
    snapCardinals: false
    netsync: false
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: gear-active
      map: ["enum.DamageStateVisualLayers.Base"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: fill-6
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: fill-
  - type: WiresVisuals
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.DamageStateVisualLayers.Base:
          True: { state: gear-active}
          False: { state: gear-idle }
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    energy: 1.6
    enabled: false
    color: "#da824d"
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    offset: "0, 0.4"
    castShadows: false
  - type: PowerSwitch
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 70
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Machine
    board: WallmountMaterialReclaimerMachineCircuitboard
  - type: WiresPanel
  - type: MaterialReclaimer
    whitelist:
      components:
      - PhysicalComposition
      - SpaceGarbage
      - Log
      - Cartridge # PDA app cartriges
      tags:
      - Trash
      - Recyclable
      - Cartridge # Bullets
      - Book
      - Pen
      - Handcuffs
    blacklist:
      components:
      - Material
      - Pda
      - IdCard
      - Brain
      tags:
      - HighRiskItem
    soundCooldown: 0
    sound:
      path: /Audio/Ambience/Objects/crushing.ogg
      params:
        volume: 5
        maxDistance: 5
        loop: true
    useOldSolutionLogic: true
    solutionContainerId: output
  - type: MaterialStorage
    insertOnInteract: false
  - type: ContainerContainer
    containers:
      active-material-reclaimer-container: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: SolutionContainerManager
    solutions:
      output:
        maxVol: 500
  - type: DrainableSolution
    solution: output
  - type: ExaminableSolution
    solution: output
  - type: StaticPrice
    price: 250
  - type: ApcPowerReceiver
    powerLoad: 300 # Allows us to not use the 1000 baseline
  - type: MaterialReclaimerMagnetPickup
    range: 0.40 # 0.3<0.50
    magnetEnabled: true
  - type: Speech
    speechVerb: Robotic
    speechSounds: SyndieBorg

- type: entity
  parent: WallmountMaterialReclaimer
  id: WallmountIDReclaimer
  name: настенный переработчик тюремных ID карт
  description: Безопасно утилизирует временные ID карты.
  components:
  - type: Sprite
    sprite: _DH/Structures/Machines/ID_reclaimer.rsi
    drawdepth: WallMountedItems
    snapCardinals: false
    netsync: false
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: gear-active
      map: ["enum.DamageStateVisualLayers.Base"]
    - state: sec
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: fill-6
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: WallmountIDReclaimerMachineCircuitboard
  - type: MaterialReclaimer
    whitelist:
      tags:
      - PrisonerIDCard
      - Pen
    soundCooldown: 0
    sound:
      path: /Audio/Ambience/Objects/crushing.ogg
      params:
        volume: 5
        maxDistance: 5
        loop: true
    useOldSolutionLogic: true
    solutionContainerId: output
