- type: entity
  name: стационарный аплинк наёмников
  parent: [BaseStructureDisableToolUse, ComputerUplinkBase, StorePresetStationMercenaryUplink, BaseStructureIndestructible, BaseStructureComputer]
  id: ComputerUplinkMercenary
  description: Покупайте снаряжение за спесо.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    netsync: false
    noRot: true
    sprite: _Lua/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: suplink
    - map: ["computerLayerKeys"]
      state: uplink_key
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      board: !type:Container
  - type: Store
    balance:
      Speso: 0
  - type: Tag
    tags:
    - StationMercenaryUplink


