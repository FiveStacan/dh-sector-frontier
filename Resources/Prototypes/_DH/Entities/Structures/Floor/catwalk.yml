- type: entity
  id: FloorHardCatwalkIron
  name:  hard catwalk iron
  description: A catwalk for easier EVA maneuvering and cable placement.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    sprite: _DH/Structures/Floor/single_catwalk.rsi
    state: hardiron
    drawdepth: FloorTiles
  - type: Icon
    sprite: _DH/Structures/Floor/single_catwalk.rsi
    state: hardiron
  - type: Transform
    anchored: true
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk
      params:
        volume: 8
  - type: Tag
    tags:
      - Catwalk
  - type: Construction
    graph: Catwalk
    node: Catwalk
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 350
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal:
            min: 2
            max: 5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
