# TODO move this to tiles once tile smoothing is supported
- type: entity
  id: WoodCatwalk
  name: деревянный мостик
  description: Мостик, сколоченный из дерева.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    sprite: _DH/Structures/Floor/wood_catwalk.rsi
    drawdepth: FloorTiles
  - type: Icon
    sprite: _DH/Structures/Floor/wood_catwalk.rsi
    state: catwalk_preview
  - type: Transform
    anchored: true
  - type: IconSmooth
    key: catwalk
    base: catwalk_
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWood
      params:
        volume: 9
  - type: Tag
    tags:
      - Catwalk
  - type: Construction
    graph: WCatwalk
    node: WCatwalk
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 110
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank: # takes two to construct, so drop less than that
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: TrayScanReveal
  - type: RCDDeconstructable
    cost: 2
    delay: 2
    fx: EffectRCDDeconstruct2
