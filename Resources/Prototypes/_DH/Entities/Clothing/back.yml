# region Backpack

- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackPrisonGuard
  name: prison guard's backpack
  description: On style.
  components:
  - type: Sprite
    sprite: _DH/Clothing/Back/Backpacks/guard.rsi

- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackNTRG
  name: NTRG Squad backpack
  description: An operative's backpack with increased capacity.
  components:
  - type: Sprite
    sprite: _DH/Clothing/Back/Backpacks/ntrgbackpack.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,6,4
  - type: ExplosionResistance
    damageCoefficient: 0.80

- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackSyndie
  name: syndie backpack
  description: An operative's backpack with increased capacity.
  components:
  - type: Sprite
    sprite: _DH/Clothing/Back/Backpacks/syndiebackpack.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,4
  - type: ExplosionResistance
    damageCoefficient: 0.1

# region Duffel

- type: entity
  parent: ClothingBackpackDuffel
  id: ClothingBackpackDuffelPrisonGuard
  name: prison guard's duffel bag
  description: On style.
  components:
  - type: Sprite
    sprite: _DH/Clothing/Back/Duffels/guard.rsi

- type: entity
  parent: [ ClothingBackpackDuffel, BaseCentcommContraband ]
  id: ClothingBackpackDuffelNanotrasenMedical
  name: nanotrasen duffel bag
  description: A duffel bag containing a variety of biological containment equipment.
  components:
  - type: Sprite
    sprite: _DH/Clothing/Back/Duffels/nanotrasen.rsi
  - type: Storage
    maxItemSize: Huge
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: HeldSpeedModifier

