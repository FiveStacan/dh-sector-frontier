- type: entity
  parent: ClothingOuterArmorBasic
  id: ADTClothingOuterArmorMiner
  name: miner armor
  description: Will not protect you from pressure, but will help you well in the battle with space fauna.
  components:
  - type: Sprite
    sprite: _DH/Clothing/OuterClothing/Armor/mining.rsi
  - type: Clothing
    sprite: _DH/Clothing/OuterClothing/Armor/mining.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.95
        Heat: 0.8
        Caustic: 0.7
  - type: ExplosionResistance
    damageCoefficient: 0.90
  - type: ToggleableClothing
    clothingPrototype: ADTClothingHeadHelmetMiner
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        showEnts: False
        occludes: True
        ents: []
      toggleable-clothing: !type:ContainerSlot {}
  - type: Tag
    tags:
    - ADTMinerArmor

- type: entity
  parent: ADTClothingOuterArmorMiner
  id: ADTClothingOuterArmorMinerHeavy
  name: heavy miner armor
  description: Improved version of miner's armor. With this xeno scale, you sacrifice speed, but have more protection.
  components:
  - type: Sprite
    layers:
    - state: icon-xeno
  - type: Clothing
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
      - state: equipped-OUTERCLOTHING-xeno
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.7
        Heat: 0.65
        Caustic: 0.60
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.75

- type: entity
  parent: ADTClothingOuterArmorMiner
  id: ADTClothingOuterArmorMinerLight
  name: light miner armor
  description: A lightweight version of miner's armor, made from dragon sinew. Thanks to ichor, you don't feel your weight.
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-unshaded-layer
      shader: unshaded
  - type: Clothing
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
      - state: equipped-OUTERCLOTHING-unshaded
        shader: unshaded
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.85
        Heat: 0.85
        Caustic: 0.9
  - type: ClothingSpeedModifier
    walkModifier: 1.2
    sprintModifier: 1.2

