# region Boots

- type: entity
  parent: [ClothingShoesBase, ClothingSlotBase]
  id: ClothingShoesBootsPrisonerGrey
  name: prisoner's boots
  description: Why they not orange?
  components:
  - type: Sprite
    sprite: _DH/Clothing/Shoes/Boots/prisoner.rsi
  - type: Clothing
    sprite: _DH/Clothing/Shoes/Boots/prisoner.rsi
  - type: ClothingSpeedModifier
    sprintModifier: 1.02

- type: entity #DH
  parent: ClothingShoesBootsMagBase
  id: ClothingShoesBootsOmni
  name: omni boots
  description: High-tech boots.
  components:
  - type: Sprite
    sprite: _DH/Clothing/Shoes/Boots/omni-boots.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: _DH/Clothing/Shoes/Boots/omni-boots.rsi
  - type: JumpAbility
    jumpDistance: 5
    jumpSound: /Audio/Effects/stealthoff.ogg
  - type: ActionGrant
    actions:
    - ActionGravityJump
  - type: ItemActionGrant
    actions:
    - ActionGravityJump
    activeIfWorn: true
  - type: StaticPrice
    price: 220
  - type: Tag
    tags: []
  - type: ClothingSlowOnDamageModifier
    modifier: 0.52
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 0
  - type: Charger
    slotId: charger_slot
    portable: true
    chargeRate: 10
  - type: ItemSlots
    slots:
      charger_slot:
        ejectOnInteract: false
        whitelist:
          components:
          - PowerCell
      item:
        name: clothing-boots-sidearm
        whitelist:
          tags:
          - Knife
          - Holdout
  - type: ClothingSpeedModifier
    sprintModifier: 1.10
  - type: Matchbox


# region MagBoots

- type: entity
  parent: ClothingShoesBootsMagBase
  id: ClothingShoesBootsMagAtmos
  name: Atmos magboots
  components:
  - type: Sprite
    sprite: _DH/Clothing/Shoes/magboots-atmos.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: _DH/Clothing/Shoes/magboots-atmos.rsi
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 0
#  - type: Item
#    size: Huge
  - type: Charger
    slotId: charger_slot
    portable: true
    chargeRate: 14
  - type: ItemSlots
    slots:
      charger_slot:
        ejectOnInteract: false
        whitelist:
          components:
          - PowerCell
  - type: ClothingSpeedModifier
    walkModifier: 0.86
    sprintModifier: 0.84

- type: entity
  parent: [ClothingShoesBootsMagSyndie, BaseToggleClothing]
  id: ClothingShoesBootsMagSpecialForce
  name: магнитные сапоги спецназа
  description: Магнитные сапоги спец войск НаноТрейзен, дорогой и более продвинутый вариант продвинутых магниток, имеет встроенный джетпак.
  components:
  - type: Sprite
    sprite: _DH/Clothing/Shoes/Boots/magboots-specialforce.rsi
    state: icon
  - type: Clothing
    sprite: _DH/Clothing/Shoes/Boots/magboots-specialforce.rsi
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1.1
  - type: Magboots
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSoldier
      params:
        volume: -2
  - type: Armor #DH
    modifiers:
      coefficients:
        Blunt: 0.97
        Slash: 0.97
        Piercing: 0.98

- type: entity
  parent: [ClothingShoesBootsMagBase, BaseToggleClothing, BaseSecurityContraband]
  id: ClothingShoesBootsMagSecurityAlt
  name: security magboots
  description: Magnetic boots are standard equipment for security services for work in zero gravity and outer space.
  components:
  - type: Sprite
    sprite: _DH/Clothing/Shoes/Boots/magboots-security.rsi
    state: icon
  - type: Clothing
    sprite: _DH/Clothing/Shoes/Boots/magboots-security.rsi
  - type: Magboots
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}

- type: entity
  parent: [ClothingShoesBootsMagSyndie, BaseToggleClothing]
  id: ClothingShoesBootsMagArmy
  name: армейские магнитные сапоги
  description: Армейский образец магнитных сапог, дешевый и более массовый вариант продвинутых магниток, имеет встроенный джетпак.
  components:
  - type: Sprite
    sprite: _DH/Clothing/Shoes/Boots/magboots-army.rsi
    state: icon
  - type: Clothing
    sprite: _DH/Clothing/Shoes/Boots/magboots-army.rsi
  - type: Magboots
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSoldier
      params:
        volume: -2

#region Socks

- type: entity
  parent: ClothingUnderwearSocksBase
  id: ADTClothingUnderwearSocksThighBlack
  name: black thigh socks
  description: Black thigh socks.
  components:
  - type: Sprite
    sprite: _DH/Clothing/Socks/black_thigh.rsi
