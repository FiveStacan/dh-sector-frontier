- type: entity
  id: StairWoodDark
  parent: Stairs
  suffix: Wood
  components:
  - type: Sprite
    sprite: _DH/Structures/stairs.rsi
    state: stairs_wood
    drawdepth: FloorTiles
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 2
            max: 5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
  - type: Construction
    graph: StairGraph
    node: StairWoodDark


- type: entity
  id: StairStageWoodDark
  parent: StairWoodDark
  suffix: Wood, stage
  components:
  - type: Sprite
    sprite: _DH/Structures/stairs.rsi
    state: stairs_stage_wood
    drawdepth: FloorTiles
  - type: Construction
    graph: StairGraph
    node: StairStageWoodDark


- type: entity
  id: WoodDoorDark
  name: dark wooden door
  parent: BaseMaterialDoorNavMap
  description: A door, where will it lead?
  components:
  - type: Sprite
    sprite: _DH/Structures/Doors/MineralDoors/wood_door.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    bumpOpen: false
    clickOpen: true
    closeTimeOne: 0.2
    closeTimeTwo: 0.6
    openTimeOne: 0.6
    openTimeTwo: 0.2
    openSound:
      path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 140
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: DoorGraph
    node: woodDoorDark

- type: entity
  id: BookshelfSmoothCenter
  parent: Bookshelf
  name: "bookshelf"
  description: Mostly filled with books.
  components:
  - type: Sprite
    sprite: _DH/Structures/Furniture/bookshelf.rsi
    snapCardinals: true
    layers:
      - state: smooth_center
      - state: book-0
      - map: ["enum.StorageFillLayers.Fill"]

