- type: entity
  abstract: true
  parent: [Clothing, RecyclableItemClothSmall] # Frontier: added RecyclableItemClothSmall
  id: ClothingShoesBase
  components:
  #DH
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_DH/Items/Handling/Shoes/pickup.ogg
      params:
        volume: -2
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_DH/Items/Handling/Shoes/drop.ogg
      params:
        volume: -2
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_DH/Items/Handling/Shoes/drop.ogg
      params:
        volume: -2
  #DH
  - type: Clothing
    equipDelay: 1 #DH
    unequipDelay: 0.5
    slots:
    - FEET
    equipSound:
      collection: GenericEquip
      params:
        volume: -5
  # Goobstation edit end
  - type: Sprite
    state: icon
  - type: Item
    size: Normal
  - type: Food
    requiresSpecialDigestion: true
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Fiber
          Quantity: 10
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
  - type: ProtectedFromStepTriggers
  - type: StaticPrice
    price: 68 #DH

- type: entity
  abstract: true
  parent: ClothingShoesBase
  id: ClothingShoesBaseButcherable
  components:
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: MaterialCloth1
      amount: 1
  - type: PhysicalComposition # 50% of the amount of cloth you'd obtain upon butchering
    materialComposition:
      Cloth: 50
  - type: Armor #DH
    modifiers:
      coefficients:
        Blunt: 0.99
        Slash: 0.99
  - type: ClothingSpeedModifier
    walkModifier: 1.01
    sprintModifier: 1.01

# stuff common to all military boots
- type: entity
  abstract: true
  parent: [ClothingShoesBase, ClothingSlotBase]
  id: ClothingShoesMilitaryBase
  components:
  - type: ClothingSlowOnDamageModifier #Lua
    modifier: 0.75
  - type: Matchbox
  - type: ItemSlots
    slots:
      item:
        name: clothing-boots-sidearm
        whitelist:
          tags:
          - Knife
          - Holdout #Lua
  - type: Armor #DH
    modifiers:
      coefficients:
        Blunt: 0.98
        Slash: 0.98
  - type: StaticPrice
    price: 60 #DH

- type: entity
  abstract: true
  id: ClothingShoesBootsSecFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      item:
      - CombatKnife

- type: entity
  abstract: true
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesBaseWinterBoots
  description: Fluffy boots to help survive even the coldest of winters.
  components:
  - type: TemperatureProtection
    heatingCoefficient: 1.025
    coolingCoefficient: 0.5
