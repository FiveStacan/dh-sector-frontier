# ADMP-27 VESPERA
- type: entity
  id: WeaponTurretVespera
  name: ADMP-27 VESPERA Rapid-Fire Pod
  parent: BallisticArtilleryUnanchorable
  description: A rapid-fire swarm missile pod manufactured by Aetherion Dynamics. Saturates targets with guided warheads to overwhelm defenses. Can be remotely activated or linked to a GCS.
  components:
  - type: StaticPrice
    price: 1500
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/vespera.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: Battery
    maxCharge: 4800
    startingCharge: 4800
  - type: ExaminableBattery
  - type: WirelessNetworkConnection
    range: 500
  - type: Gun
    fireRate: 3
    shootThermalSignature: 2000000 # ~4.9km if firing continuously
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
    soundEmpty:
      path: /Audio/Weapons/click.ogg
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 29
    autoRechargePause: true
    autoRechargePauseTime: 2
  - type: SpaceArtillery
    powerChargeRate: 29
    powerUsePassive: 800
    powerUseActive: 0
  - type: Actions
  - type: ProjectileBatteryAmmoProvider
    proto: ShipMissileASM417
    fireCost: 400
  - type: RadarBlip
    radarColor: "#FCBA03"
    scale: 2
  - type: ShipGunType
    shipType: Missile
  - type: ShipGunClass
    shipClass: Light


